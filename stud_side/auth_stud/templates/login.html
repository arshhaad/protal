{% load static %}
<!DOCTYPE html>
<html lang="en" class="bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa6z2Y9g+f2n0uVdQK5N8X2Jp1b6J5jQ6gGZVgYbR2jR+z/0fB5xj2kD5hC" crossorigin="anonymous">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.12);
            --primary: #4e9af1;
            --text: #e0e0e0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }
        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 380px;
            margin: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .btn-primary {
            background: var(--primary);
            border: none;
        }
        .btn-primary:hover {background: #3a7bd9;}
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card">
        <h2 class="text-center mb-4" style="color: var(--primary);">Student Portal</h2>
        {% if messages %}
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                {% for message in messages %}
                    alert('{{ message }}');
                {% endfor %}
            });
        </script>
        {% endif %}
        <form method="POST" action="{% url 'student:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="enroll_id" class="form-label">Enrollment ID</label>
                <input type="text" class="form-control" id="enroll_id" name="enroll_id" placeholder="STU202601" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'student:forgot_password' %}">Forgot Password?</a>
        </div>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1Z6+K5U5V8Qk7tGQ4e1nF5f5a6JX1vF5f5v6j9kVvT5" crossorigin="anonymous"></script>
    <!-- Optional Tailwind config for dark mode -->
    <script>tailwind.config = {darkMode: 'class'};</script>
</body>
</html>
