{% extends 'student/base.html' %}

{% block title %}Forgot Password - Student Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <div class="logo-icon warning-glow">
                <i data-lucide="key-round"></i>
            </div>
            <h2>Forgot Password</h2>
            <p>Enter your details below and we will send a password reset verification flow link.</p>
        </div>
        
        <form method="POST" action="{% url 'student:forgot_password' %}" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="enroll_id">Enrollment ID</label>
                <div class="input-wrapper">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" id="enroll_id" name="enroll_id" placeholder="e.g. STU202601" required autocomplete="off">
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="email" name="email" placeholder="alex.mercer@academy.edu" required autocomplete="off">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Send Verification Link</span>
                <i data-lucide="send"></i>
            </button>
        </form>
        
        <div class="auth-footer text-center">
            <a href="{% url 'student:login' %}" class="back-link">
                <i data-lucide="arrow-left"></i>
                <span>Back to Login</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
