<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — EduPortal</title>
  <meta name="description" content="Reset your EduPortal student account password." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #C5A880;
      --primary-dark: #A38A6A;
      --accent: #FFFFFF;
      --bg: #000000;
      --surface: #0a0a0a;
      --surface2: #111111;
      --border: rgba(197, 168, 128, 0.25);
      --text: #F5F5F7;
      --text-muted: #86868b;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; filter: blur(80px);
      opacity: 0.35; animation: floatBlob 8s ease-in-out infinite alternate; pointer-events: none;
    }
    body::before { width: 500px; height: 500px; background: radial-gradient(circle, #6c63ff, transparent); top: -150px; left: -150px; }
    body::after { width: 400px; height: 400px; background: radial-gradient(circle, #00d4aa, transparent); bottom: -100px; right: -100px; animation-delay: -4s; }
    @keyframes floatBlob { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,40px) scale(1.1); } }

    .card {
      background: rgba(26,26,46,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px;
      width: 100%; max-width: 440px; position: relative; z-index: 10;
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }

    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .logo-text { font-size: 22px; font-weight: 700; }
    .logo-text span { color: var(--primary); }

    .icon-wrap { width: 72px; height: 72px; background: rgba(108,99,255,0.12); border: 2px solid rgba(108,99,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(108,99,255,0.4); } 50% { box-shadow: 0 0 0 12px rgba(108,99,255,0); } }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; text-align: center; line-height: 1.6; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.5; pointer-events: none; }
    input[type="text"] {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 14px 13px 44px; font-size: 15px;
      color: var(--text); font-family: inherit; outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: var(--primary); background: rgba(108,99,255,0.08); box-shadow: 0 0 0 3px rgba(108,99,255,0.18); }
    input::placeholder { color: var(--text-muted); }

    .btn {
      width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px;
      font-weight: 600; font-family: inherit; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(108,99,255,0.5); }
    .btn:active { transform: translateY(0); }

    .back-link { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; font-size: 14px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--primary); }

    .messages { margin-bottom: 20px; }
    .msg { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 8px; }
    .msg-error { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3); color: #ff9f9f; }
    .msg-success { background: rgba(0,212,170,0.12); border: 1px solid rgba(0,212,170,0.3); color: #00d4aa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">Edu<span>Portal</span></div>
    </div>

    <div class="icon-wrap">🔑</div>
    <h1>Forgot Password?</h1>
    <p class="subtitle">Enter your Enrollment ID and we'll send you instructions to reset your password.</p>

    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="msg msg-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'forget_password' %}" id="forgotForm">
      {% csrf_token %}
      <div class="form-group">
        <label for="enroll_id">Enrollment ID</label>
        <div class="input-wrap">
          <span class="input-icon">🪪</span>
          <input type="text" id="enroll_id" name="enroll_id" placeholder="e.g. STU-2024-001" required />
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Send Reset Instructions →</button>
    </form>

    <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Sending…'; btn.style.opacity = '0.75'; btn.disabled = true;
    });
  </script>
</body>
</html>
